baseURL = "https://bez-mifov.ru/"
title = "Опровержение мифов: Бурачевский и полигон ТКО"
relativeURLs = false
theme = "PaperMod"
defaultContentLanguage = "ru"

enableRobotsTXT = true
metaDataFormat = "yaml"
summaryLength = 30

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  title = "Правда о Бурачевском: опровержение слухов о мусоре и полигоне"
  description = "Факты и судебные решения, опровергающие ложь о деятельности Бурачевского в сфере отходов. Разбор мифов."
  
  homeInfoParams = { Title = "Бурачевский и полигон: правда, а не мифы", Content = "Здесь вы найдёте документальные опровержения лжи о мусоре, отходах и судебных процессах." }

  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  
  author = "Редакция факт-чекинга"
  authorEmail = "info@bez-mifov.ru"

